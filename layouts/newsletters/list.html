{{ define "main" }}
  <div class="newsletter-toolbar">
    <div class="newsletter-toolbar-brand">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3.5 6.5l8.5 6 8.5-6"/></svg>
      Perch Mail
    </div>
    <div class="newsletter-toolbar-actions" aria-hidden="true">
      <span class="nt-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M3 7l2-4h14l2 4"/><path d="M9 12h6"/></svg>
      </span>
      <span class="nt-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M4 9h10a6 6 0 0 1 6 6v3"/></svg>
      </span>
      <span class="nt-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><polygon points="12 3 14.6 9 21 9.5 16 14 17.5 20.5 12 17 6.5 20.5 8 14 3 9.5 9.4 9"/></svg>
      </span>
      <span class="nt-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
      </span>
      <span class="nt-icon nt-icon-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="20" y1="20" x2="15.5" y2="15.5"/></svg>
      </span>
    </div>
  </div>

  <div class="newsletter-list-page">
    <ul class="newsletter-list">
      {{ range (where .Site.RegularPages "Type" "newsletter").ByDate.Reverse }}
        <li class="newsletter-list-item">
          <a href="{{ .Permalink }}">
            <span class="nli-title">{{ .Title }}</span>
            <span class="nli-date">{{ .Date.Format "Jan 2, 2006" }}</span>
            <span class="nli-summary">{{ .Summary | htmlUnescape | plainify | truncate 160 }}</span>
          </a>
        </li>
      {{ end }}
    </ul>
  </div>
{{ end }}
