{{ define "main" }}
  <article class="page-wrapper newsletter-single" style="max-width: 780px; margin: 0 auto; width: 100%;">
    <div class="page-body newsletter-body">
      {{ .Content }}
    </div>
    <footer class="newsletter-footer" style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e5e7eb;">
      <a href="{{ "/newsletters/" | absURL }}" class="back-link">← All Newsletters</a>
    </footer>
  </article>
{{ end }}
