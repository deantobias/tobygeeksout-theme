{{/*
  This file is intentionally minimal.
  Micro.blog plugins inject their footer content here automatically.
  Do not remove this file — it is required for plugins to work.
*/}}

<script>
(function () {
  const scrollBar = document.getElementById('scroll-bar');
  const header    = document.querySelector('.site-header');
  const logo      = header ? header.querySelector('.site-logo-wordmark') : null;
  if (!header) return;

  function clampFade(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }
  function easeFade(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

  // Logo image quietly fades over the first bit of scroll, same on
  // every page type — same behavior the old text wordmark had. The
  // avatar and nav never move or hide; once the logo is gone they're
  // all that's left in the header.
  var FADE_DIST = 90;

  function updateHeader() {
    var sy = window.scrollY;
    var dh = document.documentElement.scrollHeight - window.innerHeight;
    if (scrollBar) scrollBar.style.width = clampFade((sy / dh) * 100, 0, 100) + '%';
    var t = clampFade(sy / FADE_DIST, 0, 1);
    if (logo) {
      logo.style.opacity = (1 - easeFade(t)).toFixed(3);
      logo.style.pointerEvents = t >= 1 ? 'none' : 'auto';
    }
    // Once the logo has faded, its reserved space is just dead air —
    // trim the header's own padding/gap and ease the nav down a notch
    // over that same scroll distance, so the bar actually gets shorter
    // instead of holding a fixed height forever. Reverses smoothly on
    // the way back up, same as the fade itself.
    header.style.setProperty('--header-shrink', easeFade(t).toFixed(3));
  }
  window.addEventListener('scroll', updateHeader, { passive: true });
  updateHeader();
})();
</script>

<script>
/* Post title into the header (Aug 28, 2026) — titled single posts only.
   header.html renders .hdr-post-title / .hdr-post-meta on those pages;
   nothing else has them, so this exits at once everywhere else.
   Once the big .post-header-title has scrolled up under the fixed
   header, body.post-title-in-nav is set and CSS (section 90) fades the
   small title + meta in. The % is the same page-scroll figure the top
   progress bar paints, so the two never disagree. Tapping the title
   scrolls to the top (instant when reduced motion is on). */
(function () {
  var small = document.querySelector('.hdr-post-title');
  if (!small) return;
  var big = document.querySelector('.post-header-title');
  var header = document.querySelector('.site-header');
  var pct = document.querySelector('.hdr-post-pct');
  if (!big || !header) return;
  var ticking = false;
  function update() {
    var hh = header.getBoundingClientRect().height;
    var on = big.getBoundingClientRect().bottom < hh;
    document.body.classList.toggle('post-title-in-nav', on);
    if (pct) {
      var dh = document.documentElement.scrollHeight - window.innerHeight;
      var p = dh > 0 ? Math.round((window.scrollY / dh) * 100) : 0;
      pct.textContent = Math.min(100, Math.max(0, p)) + '%';
    }
    ticking = false;
  }
  window.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
  }, { passive: true });
  window.addEventListener('resize', update);
  small.addEventListener('click', function (e) {
    e.preventDefault();
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  });
  update();
})();
</script>

<script>
/* Home page about-strip: cycling tagline under "Hi, I'm Toby". Static
   fallback text is already in the HTML so it reads fine with JS off. */
(function () {
  /* July 22, 2026: also drives the desktop rail's copy — every element
     matching #tgo-tagline or .tgo-tagline-cycle cycles in lockstep. */
  var els = document.querySelectorAll('#tgo-tagline, .tgo-tagline-cycle');
  if (!els.length) return;
  var words = [
    "Technogeek.",
    "Deaf, proud of it.",
    "Blogging since 2004.",
    "LEGO builder.",
    "Tiny house dweller.",
    "OULDHH writer."
  ];
  var i = 0;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setInterval(function () {
    i = (i + 1) % words.length;
    els.forEach(function (el) { el.style.opacity = 0; });
    setTimeout(function () {
      els.forEach(function (el) {
        el.textContent = words[i];
        el.style.opacity = 1;
      });
    }, 250);
  }, 2200);
})();
</script>

<script>
/* Subscribe via RSS: copies the feed URL to the clipboard instead of
   navigating to a raw XML page, with a brief "Copied!" confirmation
   so people aren't left guessing whether the click did anything. */
(function () {
  /* July 22, 2026: class-based — covers the home strip button AND the
     rail's two feed buttons (XML + JSON), each with its own URL. */
  var btns = document.querySelectorAll('#tgo-rss-copy, .tgo-rss-copy');
  if (!btns.length) return;
  btns.forEach(function (btn) {
    var label = btn.querySelector('.tgo-rss-label');
    var defaultLabel = label ? label.textContent : 'Subscribe via RSS';
    var resetTimer;
    btn.addEventListener('click', function () {
      var url = btn.getAttribute('data-feed-url');
      if (navigator.clipboard && url) {
        navigator.clipboard.writeText(url).catch(function () {});
      }
      btn.classList.add('is-copied');
      if (label) label.textContent = 'Copied!';
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () {
        btn.classList.remove('is-copied');
        if (label) label.textContent = defaultLabel;
      }, 1800);
    });
  });
})();
</script>

<script>
/* Header clearance — detect page type by DOM, not body class.
   July 30, 2026: re-measures on resize. This used to run ONCE at
   load, so a page loaded at rail width (header display:none,
   measures 0) kept a stale -1px --header-actual-h if the window
   was then narrowed into the mobile layout — "Hi, I'm Toby" and
   page titles slid under the fixed header. Bit Toby in Brave,
   whose classic scrollbars can also flip the layout band at the
   same window size. */
(function () {
  var main = document.getElementById('main-content');
  if (!main) return;
  var siteHeader = document.querySelector('.site-header');

  var apply = function () {
    var headerH = 62;

    /* Aug 12, 2026 — measure the header at FULL size, never the
       scroll-collapsed size. apply() runs on resize, and iOS Safari /
       Brave on Android fire resize when the URL bar collapses. If that
       happened while scrolled down, this recorded the shrunken 62px
       header and locked the page to an 86px offset, so "Hi, I'm Toby"
       slid under the header as soon as you scrolled back to the top.
       Forcing --header-shrink to 0 for the measurement only — nothing
       paints between the set and the restore, so there is no flicker.
       The old -1px is gone too; header and strip share --color-bg, so
       there is no seam to hide and it was shorting the offset. */
    if (siteHeader) {
      if (getComputedStyle(siteHeader).display === 'none') {
        headerH = 0;
      } else {
        var prevShrink = siteHeader.style.getPropertyValue('--header-shrink');
        siteHeader.style.setProperty('--header-shrink', '0');
        headerH = Math.ceil(siteHeader.getBoundingClientRect().height);
        if (prevShrink !== '') {
          siteHeader.style.setProperty('--header-shrink', prevShrink);
        } else {
          siteHeader.style.removeProperty('--header-shrink');
        }
      }
    }

    /* Aug 12, 2026 (2) - only write when the value actually changes. Setting
       a custom property on documentElement invalidates style for everything
       that reads it, and pageshow fires on every bfcache restore - so tapping
       back to the home page on iOS forced a full restyle right as Safari was
       re-compositing, which read as the rabbit flickering. */
    var nextH = headerH + 'px';
    if (document.documentElement.style.getPropertyValue('--header-actual-h') !== nextH) {
      document.documentElement.style.setProperty('--header-actual-h', nextH);
    }

    // Post pages: .post-header has its own padding-top — zero out #main-content
    if (document.querySelector('.post-header')) {
      main.style.setProperty('padding-top', '0', 'important');
      return;
    }

    // Newsletter reader: full-viewport email-client layout handles its own
    // spacing and scrolling — zero out #main-content here too
    if (document.querySelector('.newsletter-single')) {
      main.style.setProperty('padding-top', '0', 'important');
      return;
    }

    // Home page: .about-strip handles spacing (via --header-actual-h above)
    if (document.querySelector('.about-strip')) return;

    // Newsletter list: banner ::before handles spacing via margin-top
    if (document.querySelector('.section-newsletters') ||
        document.body.classList.contains('section-newsletters')) return;

    // Desktop rail mode (July 22, 2026): the top header is display:none
    // ≥1024px, so it measures 0 — a fixed 32px keeps page titles from
    // hugging the viewport top instead of headerH+12 collapsing to 11px.
    if (siteHeader && getComputedStyle(siteHeader).display === 'none') {
      main.style.setProperty('padding-top', '32px', 'important');
      return;
    }

    // All other pages: push content below fixed header. +12 (was +32)
    // so page titles sit close under the nav bar on every screen size.
    main.style.setProperty('padding-top', (headerH + 12) + 'px', 'important');
  };

  apply();
  var t;
  var schedule = function () { clearTimeout(t); t = setTimeout(apply, 150); };
  window.addEventListener('resize', schedule);
  window.addEventListener('orientationchange', schedule);
  window.addEventListener('pageshow', schedule);
  window.addEventListener('load', apply);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(apply); }
})();
</script>

<script>
/* Mobile tab bar clearance — measure its real rendered height (varies
   with safe-area-inset-bottom on notched phones, and possibly with
   label/icon sizing per device) instead of guessing a fixed number in
   CSS. Sets --tab-bar-h for custom.css's body padding-bottom to use. */
(function () {
  var bar = document.querySelector('.mobile-tab-bar');
  if (!bar) return;
  var setH = function () {
    var h = bar.getBoundingClientRect().height;
    if (h > 0) document.documentElement.style.setProperty('--tab-bar-h', h + 'px');
  };
  setH();
  window.addEventListener('resize', setH);
})();
</script>

<script>
/* Mobile tab bar vs. the on-screen keyboard: when the keyboard is up
   (typing in search, etc.), the bar floats mid-screen above it with
   dead space under the icons — swollen and useless. Do what native
   apps do: hide the bar while the keyboard is open.
   Detection is by VIEWPORT HEIGHT, not input focus — on Android the
   back button closes the keyboard WITHOUT blurring the input, so a
   focus-based check left the bar hidden forever (found live July 9).
   The visual viewport shrinks >150px only for a keyboard; the URL
   bar hiding is ~56px, safely under the threshold. */
(function () {
  var bar = document.querySelector('.mobile-tab-bar');
  if (!bar || !window.visualViewport) return;
  var vv = window.visualViewport;
  var maxH = vv.height;
  var check = function () {
    if (vv.height > maxH) maxH = vv.height;
    // Class goes on <body>, not the bar: CSS needs it in two places —
    // hiding the bar AND releasing the body's reserved bottom padding
    // (otherwise an empty strip shows under the footer while the
    // keyboard is up).
    document.body.classList.toggle('kb-open', (maxH - vv.height) > 150);
  };
  vv.addEventListener('resize', check);
  window.addEventListener('orientationchange', function () {
    maxH = 0;
    setTimeout(check, 300);
  });
  check();
})();
</script>

<script>
/* Single posts, mobile: tab bar tucks away on scroll-down (past ~80px)
   and returns on scroll-up — reading stays clean, nav is one flick
   away. Same scroll-direction pattern as the header shrink. Home and
   list pages are untouched: this only runs when .post-header exists.
   CSS lives in custom.css section 41 (body.tab-bar-tucked). */
(function () {
  if (!document.querySelector('.post-header')) return;
  if (!document.querySelector('.mobile-tab-bar')) return;
  var lastY = window.scrollY;
  var ticking = false;
  var update = function () {
    var y = window.scrollY;
    if (y > lastY && y > 80) {
      document.body.classList.add('tab-bar-tucked');
    } else if (y < lastY) {
      document.body.classList.remove('tab-bar-tucked');
    }
    lastY = y;
    ticking = false;
  };
  window.addEventListener('scroll', function () {
    if (!ticking) {
      ticking = true;
      window.requestAnimationFrame(update);
    }
  }, { passive: true });
})();
</script>

<script>
/* Back pill (single posts, mobile): a plain link pointed at the
   smartest "back" target available — NO history.back() involved.
   history.back() proved unreliable here: the browser sometimes
   swallowed the first programmatic back() after a fresh page load,
   so Toby needed two taps (found July 11, 2026).
   Priority: (1) the stored timeline round-trip (same tgo-return data
   the return-to-title script keeps; landing there re-anchors to this
   post's card), (2) the same-site page the reader came from,
   (3) home, which is the href already in the markup. */
(function () {
  var pill = document.getElementById('back-pill');
  if (!pill) return;
  var data = null;
  try { data = JSON.parse(sessionStorage.getItem('tgo-return') || 'null'); } catch (e) {}
  if (data && data.post === location.href && data.list && data.list !== location.href) {
    pill.setAttribute('href', data.list);
    return;
  }
  var ref = document.referrer;
  if (ref && ref !== location.href && ref.indexOf('//' + window.location.host) !== -1) {
    pill.setAttribute('href', ref);
  }
})();
</script>

<script>
/* Search page: stays perfectly still (no scroll, no header fade, no
   footer gap) whenever #list_results is empty — whether that's the
   initial load, or after typing a search and then clearing it back
   out. This re-syncs on every results change instead of unlocking
   once and staying unlocked, so clearing the search re-locks it. */
(function () {
  var results = document.getElementById('list_results');
  if (!results) return;
  var sync = function () {
    var empty = results.children.length === 0 && results.textContent.trim() === '';
    document.body.classList.toggle('tgo-search-empty', empty);
  };
  sync();
  new MutationObserver(sync).observe(results, { childList: true, subtree: true, characterData: true });
})();
</script>

<script>
/* Skip view transitions for reloads and same-page navigations
   (e.g. refreshing, or clicking Home while already on the home page).
   Newsletter single pages are handled separately below via CSS, not by
   skipping the transition — skipping it entirely reintroduces the
   default blank-white-flash between hard page loads that view
   transitions normally mask. Instead we let the transition still run,
   but make its animation instant when landing on a newsletter page —
   see html.is-newsletter-reader rules in custom.css. */
(function () {
  function samePath(url) {
    try { return new URL(url, location.href).pathname === location.pathname; }
    catch (e) { return false; }
  }
  window.addEventListener('pageswap', function (e) {
    if (!e.viewTransition) return;
    var act = e.activation;
    if (act && (act.navigationType === 'reload' ||
        (act.entry && samePath(act.entry.url)))) {
      e.viewTransition.skipTransition();
    }
  });
  window.addEventListener('pagereveal', function (e) {
    if (!e.viewTransition || !window.navigation || !navigation.activation) return;
    var act = navigation.activation;
    if (act.navigationType === 'reload' ||
        (act.from && samePath(act.from.url))) {
      e.viewTransition.skipTransition();
    }
  });
})();
</script>

<script>
/* Return-to-title: opening a post from the timeline remembers both the
   post AND which timeline page it was on (/, /page/2/, ...). Clicking
   Home from that post returns to that timeline page, anchored to the
   post's entry. The anchor scroll runs at parse time so the
   view-transition snapshot already shows the right spot (no visible
   jump). Browser Back gets all this natively; this covers the nav. */
(function () {
  try {
    var KEY = 'tgo-return';
    var raw = sessionStorage.getItem(KEY);
    var data = null;
    if (raw) { try { data = JSON.parse(raw); } catch (e) {} }

    // Timeline pages: anchor to the post we came back from, then forget
    if (document.querySelector('.feed-wrapper')) {
      if (data && data.post) {
        var link = document.querySelector('.feed-wrapper a[href="' + data.post + '"]');
        if (link) {
          // Take over from the browser: its pixel-based restoration
          // anchors wrong once images load and shift the layout
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
          var anchor = function () {
            var card = link.closest('.post-card') || link;
            card.scrollIntoView({ block: 'center', behavior: 'instant' });
          };
          anchor();
          // Re-anchor once images have loaded (layout settles)
          window.addEventListener('load', anchor);
        }
        sessionStorage.removeItem(KEY);
      }
      // Remember which post gets opened from this timeline page
      document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a || a.origin !== location.origin) return;
        if (!/^\/20\d\d\/\d\d\/\d\d\//.test(a.pathname)) return;
        sessionStorage.setItem(KEY, JSON.stringify({ post: a.href, list: location.href }));
      }, true);
      return;
    }

    // Post pages: clicking Home goes back to the timeline page we came
    // from (page 2, 3, ...) instead of page 1. Skip when the header is
    // in pill state — that click means "scroll to top", not "navigate".
    if (data && data.post === location.href && data.list) {
      document.addEventListener('click', function (e) {
        if (window.scrollY > 126) return;
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a || a.origin !== location.origin) return;
        if (a.pathname !== '/' && a.pathname !== '') return;
        if (a.href === data.list) return;
        e.preventDefault();
        location.href = data.list;
      }, true);
    }
  } catch (err) {}
})();
</script>

<script>
/* Sunrise/sunset sky (July 12, 2026 — pairs with custom.css section 43).
   Full page, all pages incl. singles. Reader's clock — device time,
   longitude estimated from the UTC offset, mid-latitude sky assumed;
   approximate on purpose, no geolocation prompt ever.
   Daytime = stock theme exactly (all overrides removed).
   FOUR FIXED SKIES, stepped (July 12 rework, Toby's call): day,
   warm cream, navy dusk, night. Nothing blends — each phase holds
   its color and the 1.6s @property easing smooths the single-step
   changes. Text steps with the sky, and a per-tick CONTRAST GUARD
   (low-vision fix) verifies every ink against the live background,
   pushing any failing token toward black/white until it clears its
   floor (7:1 body text, 5:1 muted/navy, 4.5:1 terra links, 3:1
   tertiary). */
(function () {
  try {
    if (window.matchMedia && matchMedia('(prefers-contrast: more)').matches) return;

    var KEY = 'tgo-sky';
    var locked = false;
    try { locked = localStorage.getItem(KEY) === 'off'; } catch (e) {}

    var TOKENS_BG = ['--color-bg', '--color-bg-warm', '--color-bg-card', '--color-border', '--color-border-light'];
    var TOKENS_TEXT = ['--color-text', '--color-text-muted', '--color-text-light', '--color-navy', '--color-navy-mid', '--color-terra', '--color-terra-dark', '--color-terra-light', '--color-terra-text'];
    var DAY_TEXT   = ['#1A1A18', '#69635C', '#6F6961', '#1E2D4A', '#2E4470', '#C4622D', '#8B3E18', '#F0DDD3', '#A65326'];
    var NIGHT_TEXT = ['#FFFFFF', '#D8DEEA', '#A8B0C4', '#E8EDF7', '#C9D4EA', '#D97A45', '#E0906B', '#3A2A20', '#D97A45'];

    /* FOUR fixed skies (July 12, Toby's call — was six continuously
       blending phases, which read as "6 to 9 different colors" and
       spent minutes in muddy mid-blends no ink could survive on).
       Each phase now HOLDS its color; changes are single steps that
       the 1.6s @property easing smooths. No blending = no mid-brown
       dead zone, ever. [bg, bg-warm, card, border, border-light] */
    var P = {
      day:    ['#FAF8F5', '#F2EDE8', '#FFFFFF', '#E5DDD5', '#EDE8E2'],
      /* dawn: pale cream — Toby's call, early morning reads
         lighter than the evening */
      dawn:   ['#F6E7D2', '#EFDCC0', '#FFFCF6', '#E0CDB2', '#EAD9C2'],
      /* sunset: deeper golden-hour cream (Toby picked depth 2 of 3;
         anything darker than ~#E9C9A0 enters the unreadable band) */
      sunset: ['#F0D7B8', '#E9CBA6', '#FBF3E6', '#D9BE9B', '#E3CCAF'],
      /* deep navy dusk — Toby chose navy over darker orange for the
         between-light-and-night sky; white ink clears ~13:1 */
      dusk:   ['#2B3655', '#26304C', '#313C5E', '#455379', '#3A476A'],
      night:  ['#171E30', '#141B2C', '#1E2740', '#2E3A58', '#283350']
    };

    function hx(h) { h = h.slice(1); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
    function mix(a, b, t) { return a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); }); }
    function rgb(c) { return 'rgb(' + c.join(',') + ')'; }
    function lum(c) {
      var s = c.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
      return 0.2126 * s[0] + 0.7152 * s[1] + 0.0722 * s[2];
    }
    function ratio(a, b) {
      var l1 = lum(a), l2 = lum(b);
      var hi = Math.max(l1, l2), lo = Math.min(l1, l2);
      return (hi + 0.05) / (lo + 0.05);
    }

    /* Contrast guard (July 12, 2026 — low-vision fix): the sky blends
       the background CONTINUOUSLY, so no fixed ink palette can be safe
       at every minute of the crossover. Each tick, every text token is
       checked against the current page bg AND card bg; any token below
       its floor gets nudged toward black (day side) or white (night
       side) until it clears. Midday and deep night are untouched — the
       stock inks already pass with room to spare, so the guard only
       ever engages during the sunrise/sunset ramps. */
    function ensureInk(ink, bgs, dark, min) {
      var target = dark ? [255, 255, 255] : [0, 0, 0];
      var c = ink, t = 0;
      while (t < 1) {
        var ok = true;
        for (var i = 0; i < bgs.length; i++) { if (ratio(c, bgs[i]) < min) { ok = false; break; } }
        if (ok) return c;
        t += 0.08;
        c = mix(ink, target, Math.min(t, 1));
      }
      return c;
    }

    /* Per-token floors, same order as TOKENS_TEXT:
       text 7 (AAA body), muted 5, navy 5, navy-mid 5,
       light 4.5 — was 3 until Aug 18, 2026. A 3:1 floor is the LARGE-text
       allowance, but this token paints dates, captions and meta lines at
       0.75-0.8rem, so it was shipping small text at 2.8-3.5:1 through the
       sunset and dusk steps (14 and 6 elements on the home page alone).
       AA for small text is 4.5, so that is the floor now.
       terra 4.5 (links), terra-dark 4.5,
       terra-text 4.5 — small-text terracotta, added Aug 18, 2026 so the
       guard carries it through the ramps the same way it carries terra.
       terra-light 0 (it's a
       background/accent tint, not an ink — guarding it would wreck
       the gradients it lives in). Floors deliberately sit ABOVE bare
       AA — Toby's call, low-vision readers first. */
    var INK_MIN = [7, 5, 4.5, 5, 5, 4.5, 4.5, 0, 4.5];

    /* Sun times, reader's clock. NOAA-style approximation. */
    function sunTimes() {
      var d = new Date();
      var rad = Math.PI / 180;
      var tz = -d.getTimezoneOffset();          /* minutes east of UTC */
      var lon = tz / 4, lat = 38;               /* estimate from clock; mid-latitude sky */
      var doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
      var g = 2 * Math.PI / 365 * (doy - 1);
      var eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
      var dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
      var cosHa = Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(dec)) - Math.tan(lat * rad) * Math.tan(dec);
      if (cosHa > 1 || cosHa < -1) return { r: 360, s: 1080 };
      var ha = Math.acos(cosHa) / rad;
      return { r: 720 - 4 * (lon + ha) - eq + tz, s: 720 - 4 * (lon - ha) - eq + tz };
    }

    /* Stepped schedule — each phase holds, nothing blends:
       night → (R-60) navy dusk → (R) pale dawn cream → (R+100) day
       → (S-90) deeper sunset cream → (S) navy dusk → (S+60) night */
    function bgAt(mins, R, S) {
      if (mins < R - 60 || mins >= S + 60) return P.night.map(hx);
      if (mins < R) return P.dusk.map(hx);
      if (mins < R + 100) return P.dawn.map(hx);
      if (mins <= S - 90) return P.day.map(hx);
      if (mins < S) return P.sunset.map(hx);
      return P.dusk.map(hx);
    }

    var root = document.documentElement;
    /* Two logo slots (July 12 final, Toby simplified from three):
       light skies (day + both creams) = stock logo (navy + orange);
       dark skies (navy dusk + night) = white + orange. The retired
       white + blue glasses variant lives at
       uploads/2026/sunset-before-8-pm-toby-geeks-out-new-logo.png
       if Toby ever wants a third slot back. */
    var DAY_LOGO   = 'https://tobygeeksout.micro.blog/uploads/2026/tobygeeksoutlogonew.png';
    var NIGHT_LOGO = 'https://tobygeeksout.micro.blog/uploads/2026/sunset-toby-geeks-out-new-logo.png';
    function setLogo(mode) {
      /* Header wordmark AND the desktop rail logo (July 22, 2026) —
         both swap together through the skies. */
      var logos = document.querySelectorAll('.site-logo-wordmark, .rail-logo');
      if (!logos.length) return;
      var want = mode === 'night' ? NIGHT_LOGO : DAY_LOGO;
      logos.forEach(function (logo) {
        if (logo.src !== want) logo.src = want;
      });
    }
    /* Browser tab/address bar follows the sky (July 19, 2026):
       keep the theme-color meta in lockstep with --color-bg so
       mobile browser chrome melts through dawn/sunset/dusk/night
       with the page. Safari iOS and Chrome/Brave Android honor it;
       some Android browsers override light values in system dark
       mode; desktop mostly ignores it — harmless where ignored. */
    function setBar(c) {
      var m = document.querySelector('meta[name="theme-color"]');
      if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
      if (m.getAttribute('content') !== c) m.setAttribute('content', c);
    }

    function clearSky() {
      TOKENS_BG.concat(TOKENS_TEXT).forEach(function (t) { root.style.removeProperty(t); });
      document.body.classList.remove('tgo-night');
      setLogo('day');
      setBar('#F5F0EA'); /* NOT the page bg #FAF8F5 — Chromium discards
         near-white theme-colors (paints default white). This is the
         closest accepted cream; matches the static meta in head.html */
    }

    function tick() {
      var d = new Date();
      /* Test hook: append ?sky=21:30 to any URL to preview that time.
         Sticks for the whole tab session (survives page-to-page clicks,
         Micro.blog strips the query on redirects); ?sky=off clears it. */
      var forced = location.search.match(/[?&]sky=(\d{1,2}):(\d{2})/);
      try {
        if (/[?&]sky=off/.test(location.search)) sessionStorage.removeItem('tgo-sky-test');
        else if (forced) sessionStorage.setItem('tgo-sky-test', forced[1] + ':' + forced[2]);
        else {
          var saved = sessionStorage.getItem('tgo-sky-test');
          if (saved) forced = saved.match(/(\d{1,2}):(\d{2})/);
        }
      } catch (e) {}
      var mins = forced ? (+forced[1]) * 60 + (+forced[2]) : d.getHours() * 60 + d.getMinutes();
      var sun = sunTimes();
      var isPureDay = mins >= sun.r + 100 && mins <= sun.s - 90;
      /* Show toggle only when sky is active — hide during pure daytime
         so readers don't click a button that appears to do nothing. */
      document.querySelectorAll('.tgo-sky-btn').forEach(function(b) {
        b.classList.toggle('tgo-sky-hidden', isPureDay);
      });
      if (locked) { clearSky(); return; }
      /* Pure day: remove every override so midday is EXACTLY stock. */
      if (isPureDay) { clearSky(); return; }
      var bg = bgAt(mins, sun.r, sun.s);
      /* No dead-band logic needed anymore: the four fixed skies all
         sit safely outside the ~0.10–0.30 luminance band where no ink
         works. The old continuous blending needed a band-skip here;
         stepped phases made it obsolete (July 12). */
      TOKENS_BG.forEach(function (t, i) { root.style.setProperty(t, rgb(bg[i])); });
      /* Step text tokens at the luminance threshold, then run every
         ink through the contrast guard against both the page bg and
         the card bg — whichever is worse for that ink wins. */
      var dark = lum(bg[0]) < 0.17;
      var baseInks = dark ? NIGHT_TEXT : DAY_TEXT;
      var bgsToCheck = [bg[0], bg[2]];
      TOKENS_TEXT.forEach(function (t, i) {
        var ink = hx(baseInks[i]);
        if (INK_MIN[i] > 0) ink = ensureInk(ink, bgsToCheck, dark, INK_MIN[i]);
        root.style.setProperty(t, rgb(ink));
      });
      document.body.classList.toggle('tgo-night', dark);
      /* Logo through the day: light skies keep the stock logo (the
         white-text variants would vanish on cream). Once the sky
         flips dark: white + blue glasses through the sunset/dusk
         transition windows, white + orange glasses for full night.
         Pure midday never reaches here (clearSky handles it). */
      /* Logos track the skies: light = stock, dark = white + orange. */
      setLogo(dark ? 'night' : 'day');
      setBar(rgb(bg[0])); /* browser bar = current page bg */
    }

    /* Footer control: lets a reader freeze the sky to the stock look. */
    function addToggle() {
      var sunSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tgo-sky-icon" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
      var trackHTML = '<span class="tgo-sky-track" aria-hidden="true"><span class="tgo-sky-knob"></span></span>';

      function makeBtn(extraClass) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'tgo-sky-hidden tgo-sky-btn ' + extraClass + (locked ? ' is-locked' : '');
        var lbl = locked ? 'Sky off — tap to follow the sun' : 'Sky on — tap to use fixed colors';
        b.setAttribute('aria-label', lbl);
        b.setAttribute('title', lbl);
        b.innerHTML = sunSVG + trackHTML;
        return b;
      }

      var buttons = [];
      var headerRow = document.querySelector('.header-top-row');
      var navRow    = document.querySelector('.site-nav-row');
      var railSlot  = document.querySelector('.rail-sky-slot');

      if (headerRow) { var hb = makeBtn('tgo-sky-btn--header'); headerRow.appendChild(hb); buttons.push(hb); }
      if (navRow)    { var nb = makeBtn('tgo-sky-btn--nav');    navRow.appendChild(nb);    buttons.push(nb); }
      /* Desktop rail slot (July 22, 2026) — the top header is hidden
         ≥1024px, so the rail carries its own copy of the toggle. */
      if (railSlot)  { var rb = makeBtn('tgo-sky-btn--rail');   railSlot.appendChild(rb);  buttons.push(rb); }

      function updateBtns() {
        var lbl = locked ? 'Sky off — tap to follow the sun' : 'Sky on — tap to use fixed colors';
        buttons.forEach(function(b) {
          if (locked) b.classList.add('is-locked'); else b.classList.remove('is-locked');
          b.setAttribute('aria-label', lbl);
          b.setAttribute('title', lbl);
        });
      }

      buttons.forEach(function(b) {
        b.addEventListener('click', function() {
          locked = !locked;
          try { localStorage.setItem(KEY, locked ? 'off' : 'auto'); } catch (e) {}
          updateBtns();
          tick();
        });
      });
      /* Initialize visibility immediately — tick() may have run before
         buttons existed if readyState was 'loading' at script exec. */
      tick();
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addToggle);
    else addToggle();
    tick();
    setInterval(tick, 120000);
    /* Enable color easing only AFTER the first paint — pages load
       already-lit instead of flashing day colors while easing. */
    requestAnimationFrame(function () {
      setTimeout(function () { root.classList.add('tgo-anim'); }, 80);
    });
  } catch (err) {}
})();
</script>

<script>
/* ------------------------------------------------------------
   WCAG 4.1.2 / 3.3.2 — reply box label  (Aug 18, 2026)
   ------------------------------------------------------------
   Micro.blog injects the conversation reply form itself, and the
   textarea it ships has no label, no placeholder and no aria-label —
   a screen reader announces it as a bare "edit text" with nothing to
   say what it is. We can't change the injected markup, so name it
   after the fact. Runs on load and again on DOM changes, because the
   form is injected asynchronously and can re-render after a reply.
   ------------------------------------------------------------ */
(function () {
  function nameReplyBox() {
    document.querySelectorAll('.microblog_reply_form textarea:not([aria-label])')
      .forEach(function (t) { t.setAttribute('aria-label', 'Write a reply'); });
    document.querySelectorAll('.microblog_reply_button input[type="submit"]:not([aria-label])')
      .forEach(function (b) { if (!b.value) b.setAttribute('aria-label', 'Send reply'); });

    /* WCAG 1.1.1 (Aug 19, 2026) — the Micro.blog bookshelf plugin injects
       its cover thumbnail as <img class="microblog_book"> with NO alt
       attribute at all, so a screen reader reads out the file name. The
       plugin gives us nothing to build a real name from (the src is
       always .../cover.jpg, there is no title attribute and the image is
       not inside a link), and the post's own words carry the meaning, so
       the honest fix is to mark it explicitly decorative. If a cover ever
       IS the only thing identifying a book, write a real alt into that
       post's markup — an author-supplied alt is left alone here. */
    document.querySelectorAll('img.microblog_book:not([alt])')
      .forEach(function (i) { i.setAttribute('alt', ''); i.setAttribute('role', 'presentation'); });
  }
  nameReplyBox();
  document.addEventListener('DOMContentLoaded', nameReplyBox);
  if ('MutationObserver' in window) {
    new MutationObserver(nameReplyBox).observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>

<!-- Word Nerd Alert - pills swap the band in place (Aug 19, 2026) -->
<script>
(function () {
  var band = document.querySelector(".wna");
  if (!band) return;
  var body  = band.querySelector(".wna-body"),
      link  = band.querySelector(".wna-permalink"),
      stamp = link && link.querySelector("time"),
      older = band.querySelector(".wna-older"),
      chips = band.querySelectorAll(".wna-chip"),
      store = band.querySelectorAll(".wna-store");
  if (!body || !store.length) return;

  function find(i) {
    for (var k = 0; k < store.length; k++) {
      if (store[k].getAttribute("data-i") === String(i)) return store[k];
    }
    return null;
  }

  function show(i) {
    var t = find(i);
    if (!t) return;
    body.classList.add("is-swapping");
    window.setTimeout(function () {
      body.innerHTML = t.innerHTML;
      if (link)  link.setAttribute("href", t.getAttribute("data-url"));
      if (stamp) {
        stamp.textContent = t.getAttribute("data-date");
        stamp.setAttribute("datetime", t.getAttribute("data-iso"));
      }
      if (older) older.hidden = (String(i) === "0");
      body.classList.remove("is-swapping");
    }, 160);
    Array.prototype.forEach.call(chips, function (c) {
      if (c.getAttribute("data-i") === String(i)) c.setAttribute("aria-current", "true");
      else c.removeAttribute("aria-current");
    });
  }

  Array.prototype.forEach.call(chips, function (c) {
    c.addEventListener("click", function (e) {
      e.preventDefault();
      show(c.getAttribute("data-i"));
    });
  });

  /* "Back to today" - only visible once you have wandered off word 0 */
  if (older) {
    older.addEventListener("click", function () { show(0); });
  }
}());
</script>

<script>
/* Optical underline offset (Aug 21, 2026): prose links whose text
   has no descenders get .tgo-snug — custom.css Section 88 pulls
   their wavy underline back to the site-wide 5.5px instead of the
   Lora descender-clearance 8/9px. Toby's catch: "Pandemic" floated
   while "Cold Plague" sat right. The test is a whitelist, not a
   descender blacklist — commas, parens, slashes, accents, Q/J tails
   and anything unrecognized all FAIL SAFE and keep the big offset.
   Digits allowed because Lora defaults to lining figures; if a
   numeral ever dips, remove 0-9 from SAFE. */
(function () {
  var links = document.querySelectorAll(
    ':is(.post-body, .page-body, .micro-body, .micro-entry-text, .post-card-content, .post-card-excerpt) a:not(.read-more-link):not(.btn-subscribe)'
  );
  if (!links.length) return;
  /* Caps minus J/Q (their tails cross the baseline in Lora),
     lowercase minus g j p q y, digits, space, flat punctuation. */
  var SAFE = /^[A-IK-PR-Za-fh-ik-or-xz0-9\s.\u2018\u2019\u201C\u201D'"!?:&\u2013\u2014\u2026-]+$/;
  links.forEach(function (a) {
    var t = a.textContent.trim();
    if (!t || !SAFE.test(t)) return;
    /* Italic Lora's f descends; roman f does not. */
    if (t.indexOf('f') !== -1 && getComputedStyle(a).fontStyle !== 'normal') return;
    a.classList.add('tgo-snug');
  });
}());
</script>
