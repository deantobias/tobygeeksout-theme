{{/*
  This file is intentionally minimal.
  Micro.blog plugins inject their footer content here automatically.
  Do not remove this file — it is required for plugins to work.
*/}}

<script>
(function () {
  const scrollBar = document.getElementById('scroll-bar');
  const header    = document.querySelector('.site-header');
  const logo      = header ? header.querySelector('.site-logo-wordmark') : null;
  if (!header) return;

  function clampFade(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }
  function easeFade(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

  // Logo image quietly fades over the first bit of scroll, same on
  // every page type — same behavior the old text wordmark had. The
  // avatar and nav never move or hide; once the logo is gone they're
  // all that's left in the header.
  var FADE_DIST = 90;

  function updateHeader() {
    var sy = window.scrollY;
    var dh = document.documentElement.scrollHeight - window.innerHeight;
    if (scrollBar) scrollBar.style.width = clampFade((sy / dh) * 100, 0, 100) + '%';
    var t = clampFade(sy / FADE_DIST, 0, 1);
    if (logo) {
      logo.style.opacity = (1 - easeFade(t)).toFixed(3);
      logo.style.pointerEvents = t >= 1 ? 'none' : 'auto';
    }
    // Once the logo has faded, its reserved space is just dead air —
    // trim the header's own padding/gap and ease the nav down a notch
    // over that same scroll distance, so the bar actually gets shorter
    // instead of holding a fixed height forever. Reverses smoothly on
    // the way back up, same as the fade itself.
    header.style.setProperty('--header-shrink', easeFade(t).toFixed(3));
  }
  window.addEventListener('scroll', updateHeader, { passive: true });
  updateHeader();
})();
</script>

<script>
/* Home page about-strip: cycling tagline under "Hi, I'm Toby". Static
   fallback text is already in the HTML so it reads fine with JS off. */
(function () {
  var el = document.getElementById('tgo-tagline');
  if (!el) return;
  var words = [
    "Technogeek.",
    "Deaf, proud of it.",
    "Blogging since 2004.",
    "LEGO builder.",
    "Tiny house dweller.",
    "OULDHH writer."
  ];
  var i = 0;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setInterval(function () {
    i = (i + 1) % words.length;
    el.style.opacity = 0;
    setTimeout(function () {
      el.textContent = words[i];
      el.style.opacity = 1;
    }, 250);
  }, 2200);
})();
</script>

<script>
/* Subscribe via RSS: copies the feed URL to the clipboard instead of
   navigating to a raw XML page, with a brief "Copied!" confirmation
   so people aren't left guessing whether the click did anything. */
(function () {
  var btn = document.getElementById('tgo-rss-copy');
  if (!btn) return;
  var label = btn.querySelector('.tgo-rss-label');
  var defaultLabel = label ? label.textContent : 'Subscribe via RSS';
  var resetTimer;
  btn.addEventListener('click', function () {
    var url = btn.getAttribute('data-feed-url');
    if (navigator.clipboard && url) {
      navigator.clipboard.writeText(url).catch(function () {});
    }
    btn.classList.add('is-copied');
    if (label) label.textContent = 'Copied!';
    clearTimeout(resetTimer);
    resetTimer = setTimeout(function () {
      btn.classList.remove('is-copied');
      if (label) label.textContent = defaultLabel;
    }, 1800);
  });
})();
</script>

<script>
/* Header clearance — detect page type by DOM, not body class */
(function () {
  var main = document.getElementById('main-content');
  if (!main) return;
  var siteHeader = document.querySelector('.site-header');
  var headerH = siteHeader ? Math.round(siteHeader.getBoundingClientRect().height) : 62;

  // Subtract 1px so banner overlaps header bottom edge — prevents subpixel gap on mobile
  document.documentElement.style.setProperty('--header-actual-h', (headerH - 1) + 'px');

  // Post pages: .post-header has its own padding-top — zero out #main-content
  if (document.querySelector('.post-header')) {
    main.style.setProperty('padding-top', '0', 'important');
    return;
  }

  // Newsletter reader: full-viewport email-client layout handles its own
  // spacing and scrolling — zero out #main-content here too
  if (document.querySelector('.newsletter-single')) {
    main.style.setProperty('padding-top', '0', 'important');
    return;
  }

  // Home page: .about-strip handles spacing
  if (document.querySelector('.about-strip')) return;

  // Newsletter list: banner ::before handles spacing via margin-top
  if (document.querySelector('.section-newsletters') ||
      document.body.classList.contains('section-newsletters')) return;

  // All other pages: push content below fixed header. +12 (was +32)
  // so page titles sit close under the nav bar on every screen size.
  main.style.setProperty('padding-top', (headerH + 12) + 'px', 'important');
})();
</script>

<script>
/* Mobile tab bar clearance — measure its real rendered height (varies
   with safe-area-inset-bottom on notched phones, and possibly with
   label/icon sizing per device) instead of guessing a fixed number in
   CSS. Sets --tab-bar-h for custom.css's body padding-bottom to use. */
(function () {
  var bar = document.querySelector('.mobile-tab-bar');
  if (!bar) return;
  var setH = function () {
    var h = bar.getBoundingClientRect().height;
    if (h > 0) document.documentElement.style.setProperty('--tab-bar-h', h + 'px');
  };
  setH();
  window.addEventListener('resize', setH);
})();
</script>

<script>
/* Mobile tab bar vs. the on-screen keyboard: when the keyboard is up
   (typing in search, etc.), the bar floats mid-screen above it with
   dead space under the icons — swollen and useless. Do what native
   apps do: hide the bar while the keyboard is open.
   Detection is by VIEWPORT HEIGHT, not input focus — on Android the
   back button closes the keyboard WITHOUT blurring the input, so a
   focus-based check left the bar hidden forever (found live July 9).
   The visual viewport shrinks >150px only for a keyboard; the URL
   bar hiding is ~56px, safely under the threshold. */
(function () {
  var bar = document.querySelector('.mobile-tab-bar');
  if (!bar || !window.visualViewport) return;
  var vv = window.visualViewport;
  var maxH = vv.height;
  var check = function () {
    if (vv.height > maxH) maxH = vv.height;
    // Class goes on <body>, not the bar: CSS needs it in two places —
    // hiding the bar AND releasing the body's reserved bottom padding
    // (otherwise an empty strip shows under the footer while the
    // keyboard is up).
    document.body.classList.toggle('kb-open', (maxH - vv.height) > 150);
  };
  vv.addEventListener('resize', check);
  window.addEventListener('orientationchange', function () {
    maxH = 0;
    setTimeout(check, 300);
  });
  check();
})();
</script>

<script>
/* Single posts, mobile: tab bar tucks away on scroll-down (past ~80px)
   and returns on scroll-up — reading stays clean, nav is one flick
   away. Same scroll-direction pattern as the header shrink. Home and
   list pages are untouched: this only runs when .post-header exists.
   CSS lives in custom.css section 41 (body.tab-bar-tucked). */
(function () {
  if (!document.querySelector('.post-header')) return;
  if (!document.querySelector('.mobile-tab-bar')) return;
  var lastY = window.scrollY;
  var ticking = false;
  var update = function () {
    var y = window.scrollY;
    if (y > lastY && y > 80) {
      document.body.classList.add('tab-bar-tucked');
    } else if (y < lastY) {
      document.body.classList.remove('tab-bar-tucked');
    }
    lastY = y;
    ticking = false;
  };
  window.addEventListener('scroll', function () {
    if (!ticking) {
      ticking = true;
      window.requestAnimationFrame(update);
    }
  }, { passive: true });
})();
</script>

<script>
/* Back pill (single posts, mobile): a plain link pointed at the
   smartest "back" target available — NO history.back() involved.
   history.back() proved unreliable here: the browser sometimes
   swallowed the first programmatic back() after a fresh page load,
   so Toby needed two taps (found July 11, 2026).
   Priority: (1) the stored timeline round-trip (same tgo-return data
   the return-to-title script keeps; landing there re-anchors to this
   post's card), (2) the same-site page the reader came from,
   (3) home, which is the href already in the markup. */
(function () {
  var pill = document.getElementById('back-pill');
  if (!pill) return;
  var data = null;
  try { data = JSON.parse(sessionStorage.getItem('tgo-return') || 'null'); } catch (e) {}
  if (data && data.post === location.href && data.list && data.list !== location.href) {
    pill.setAttribute('href', data.list);
    return;
  }
  var ref = document.referrer;
  if (ref && ref !== location.href && ref.indexOf('//' + window.location.host) !== -1) {
    pill.setAttribute('href', ref);
  }
})();
</script>

<script>
/* Search page: stays perfectly still (no scroll, no header fade, no
   footer gap) whenever #list_results is empty — whether that's the
   initial load, or after typing a search and then clearing it back
   out. This re-syncs on every results change instead of unlocking
   once and staying unlocked, so clearing the search re-locks it. */
(function () {
  var results = document.getElementById('list_results');
  if (!results) return;
  var sync = function () {
    var empty = results.children.length === 0 && results.textContent.trim() === '';
    document.body.classList.toggle('tgo-search-empty', empty);
  };
  sync();
  new MutationObserver(sync).observe(results, { childList: true, subtree: true, characterData: true });
})();
</script>

<script>
/* Skip view transitions for reloads and same-page navigations
   (e.g. refreshing, or clicking Home while already on the home page).
   Newsletter single pages are handled separately below via CSS, not by
   skipping the transition — skipping it entirely reintroduces the
   default blank-white-flash between hard page loads that view
   transitions normally mask. Instead we let the transition still run,
   but make its animation instant when landing on a newsletter page —
   see html.is-newsletter-reader rules in custom.css. */
(function () {
  function samePath(url) {
    try { return new URL(url, location.href).pathname === location.pathname; }
    catch (e) { return false; }
  }
  window.addEventListener('pageswap', function (e) {
    if (!e.viewTransition) return;
    var act = e.activation;
    if (act && (act.navigationType === 'reload' ||
        (act.entry && samePath(act.entry.url)))) {
      e.viewTransition.skipTransition();
    }
  });
  window.addEventListener('pagereveal', function (e) {
    if (!e.viewTransition || !window.navigation || !navigation.activation) return;
    var act = navigation.activation;
    if (act.navigationType === 'reload' ||
        (act.from && samePath(act.from.url))) {
      e.viewTransition.skipTransition();
    }
  });
})();
</script>

<script>
/* Return-to-title: opening a post from the timeline remembers both the
   post AND which timeline page it was on (/, /page/2/, ...). Clicking
   Home from that post returns to that timeline page, anchored to the
   post's entry. The anchor scroll runs at parse time so the
   view-transition snapshot already shows the right spot (no visible
   jump). Browser Back gets all this natively; this covers the nav. */
(function () {
  try {
    var KEY = 'tgo-return';
    var raw = sessionStorage.getItem(KEY);
    var data = null;
    if (raw) { try { data = JSON.parse(raw); } catch (e) {} }

    // Timeline pages: anchor to the post we came back from, then forget
    if (document.querySelector('.feed-wrapper')) {
      if (data && data.post) {
        var link = document.querySelector('.feed-wrapper a[href="' + data.post + '"]');
        if (link) {
          // Take over from the browser: its pixel-based restoration
          // anchors wrong once images load and shift the layout
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
          var anchor = function () {
            var card = link.closest('.post-card') || link;
            card.scrollIntoView({ block: 'center', behavior: 'instant' });
          };
          anchor();
          // Re-anchor once images have loaded (layout settles)
          window.addEventListener('load', anchor);
        }
        sessionStorage.removeItem(KEY);
      }
      // Remember which post gets opened from this timeline page
      document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a || a.origin !== location.origin) return;
        if (!/^\/20\d\d\/\d\d\/\d\d\//.test(a.pathname)) return;
        sessionStorage.setItem(KEY, JSON.stringify({ post: a.href, list: location.href }));
      }, true);
      return;
    }

    // Post pages: clicking Home goes back to the timeline page we came
    // from (page 2, 3, ...) instead of page 1. Skip when the header is
    // in pill state — that click means "scroll to top", not "navigate".
    if (data && data.post === location.href && data.list) {
      document.addEventListener('click', function (e) {
        if (window.scrollY > 126) return;
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a || a.origin !== location.origin) return;
        if (a.pathname !== '/' && a.pathname !== '') return;
        if (a.href === data.list) return;
        e.preventDefault();
        location.href = data.list;
      }, true);
    }
  } catch (err) {}
})();
</script>

<script>
/* Sunrise/sunset sky (July 12, 2026 — pairs with custom.css section 43).
   Full page, all pages incl. singles. Reader's clock — device time,
   longitude estimated from the UTC offset, mid-latitude sky assumed;
   approximate on purpose, no geolocation prompt ever.
   Daytime = stock theme exactly (all overrides removed).
   Text tokens STEP at a background-luminance threshold instead of
   blending — blending both text and background through the dusk
   crossover would hit a moment of zero contrast. The step lands where
   BOTH inks clear ~AA against the background, and the @property
   transition eases the visible switch. */
(function () {
  try {
    if (window.matchMedia && matchMedia('(prefers-contrast: more)').matches) return;

    var KEY = 'tgo-sky';
    var locked = false;
    try { locked = localStorage.getItem(KEY) === 'off'; } catch (e) {}

    var TOKENS_BG = ['--color-bg', '--color-bg-warm', '--color-bg-card', '--color-border', '--color-border-light'];
    var TOKENS_TEXT = ['--color-text', '--color-text-muted', '--color-text-light', '--color-navy', '--color-navy-mid', '--color-terra', '--color-terra-dark', '--color-terra-light'];
    var DAY_TEXT   = ['#1A1A18', '#6B645D', '#9C9489', '#1E2D4A', '#2E4470', '#C4622D', '#8B3E18', '#F0DDD3'];
    var NIGHT_TEXT = ['#FFFFFF', '#D8DEEA', '#A8B0C4', '#E8EDF7', '#C9D4EA', '#D97A45', '#E0906B', '#3A2A20'];

    /* bg-token sets per phase: [bg, bg-warm, card, border, border-light] */
    var P = {
      day:    ['#FAF8F5', '#F2EDE8', '#FFFFFF', '#E5DDD5', '#EDE8E2'],
      golden: ['#F6E7D2', '#EFDCC0', '#FFFCF6', '#E0CDB2', '#EAD9C2'],
      sunset: ['#F0D7B8', '#E9CBA6', '#FBF3E6', '#D9BE9B', '#E3CCAF'],
      cross:  ['#A56B41', '#9A6138', '#AC7248', '#8A5530', '#935C36'],
      dusk:   ['#232C48', '#1E2740', '#273252', '#34405F', '#2C3856'],
      night:  ['#171E30', '#141B2C', '#1E2740', '#2E3A58', '#283350']
    };

    function hx(h) { h = h.slice(1); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
    function mix(a, b, t) { return a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); }); }
    function rgb(c) { return 'rgb(' + c.join(',') + ')'; }
    function lum(c) {
      var s = c.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
      return 0.2126 * s[0] + 0.7152 * s[1] + 0.0722 * s[2];
    }

    /* Sun times, reader's clock. NOAA-style approximation. */
    function sunTimes() {
      var d = new Date();
      var rad = Math.PI / 180;
      var tz = -d.getTimezoneOffset();          /* minutes east of UTC */
      var lon = tz / 4, lat = 38;               /* estimate from clock; mid-latitude sky */
      var doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
      var g = 2 * Math.PI / 365 * (doy - 1);
      var eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
      var dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
      var cosHa = Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(dec)) - Math.tan(lat * rad) * Math.tan(dec);
      if (cosHa > 1 || cosHa < -1) return { r: 360, s: 1080 };
      var ha = Math.acos(cosHa) / rad;
      return { r: 720 - 4 * (lon + ha) - eq + tz, s: 720 - 4 * (lon - ha) - eq + tz };
    }

    function bgAt(mins, R, S) {
      var A = [
        [0, P.night], [R - 70, P.night], [R - 30, P.dusk], [R - 12, P.cross],
        [R + 5, P.sunset], [R + 50, P.golden], [R + 100, P.day],
        [S - 90, P.day], [S - 45, P.golden], [S - 12, P.sunset],
        [S + 6, P.cross], [S + 24, P.dusk], [S + 75, P.night], [1440, P.night]
      ];
      for (var i = 0; i < A.length - 1; i++) {
        if (mins >= A[i][0] && mins <= A[i + 1][0]) {
          var f = A[i + 1][0] === A[i][0] ? 0 : (mins - A[i][0]) / (A[i + 1][0] - A[i][0]);
          return A[i][1].map(function (c, j) { return mix(hx(c), hx(A[i + 1][1][j]), f); });
        }
      }
      return P.night.map(hx);
    }

    var root = document.documentElement;
    var NIGHT_LOGO = 'https://tobygeeksout.micro.blog/uploads/2026/sunset-toby-geeks-out-new-logo.png';
    function setLogo(dark) {
      var logo = document.querySelector('.site-logo-wordmark');
      if (!logo) return;
      if (!logo.getAttribute('data-day-src')) logo.setAttribute('data-day-src', logo.src);
      var want = dark ? NIGHT_LOGO : logo.getAttribute('data-day-src');
      if (logo.src !== want) logo.src = want;
    }
    function clearSky() {
      TOKENS_BG.concat(TOKENS_TEXT).forEach(function (t) { root.style.removeProperty(t); });
      document.body.classList.remove('tgo-night');
      setLogo(false);
    }

    function tick() {
      if (locked) { clearSky(); return; }
      var d = new Date();
      /* Test hook: append ?sky=21:30 to any URL to preview that time.
         Sticks for the whole tab session (survives page-to-page clicks,
         Micro.blog strips the query on redirects); ?sky=off clears it. */
      var forced = location.search.match(/[?&]sky=(\d{1,2}):(\d{2})/);
      try {
        if (/[?&]sky=off/.test(location.search)) sessionStorage.removeItem('tgo-sky-test');
        else if (forced) sessionStorage.setItem('tgo-sky-test', forced[1] + ':' + forced[2]);
        else {
          var saved = sessionStorage.getItem('tgo-sky-test');
          if (saved) forced = saved.match(/(\d{1,2}):(\d{2})/);
        }
      } catch (e) {}
      var mins = forced ? (+forced[1]) * 60 + (+forced[2]) : d.getHours() * 60 + d.getMinutes();
      var sun = sunTimes();
      /* Pure day: remove every override so midday is EXACTLY stock. */
      if (mins >= sun.r + 100 && mins <= sun.s - 90) { clearSky(); return; }
      var bg = bgAt(mins, sun.r, sun.s);
      TOKENS_BG.forEach(function (t, i) { root.style.setProperty(t, rgb(bg[i])); });
      /* Step text tokens where both inks clear ~AA vs the background. */
      var dark = lum(bg[0]) < 0.17;
      TOKENS_TEXT.forEach(function (t, i) { root.style.setProperty(t, dark ? NIGHT_TEXT[i] : DAY_TEXT[i]); });
      document.body.classList.toggle('tgo-night', dark);
      setLogo(dark);
    }

    /* Footer control: lets a reader freeze the sky to the stock look. */
    function addToggle() {
      var footer = document.querySelector('.site-footer') || document.querySelector('footer');
      if (!footer) return;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tgo-sky-toggle';
      function label() { b.textContent = locked ? 'Sky: off — page ignores the time of day' : 'Sky: auto — page follows the sun'; }
      label();
      b.addEventListener('click', function () {
        locked = !locked;
        try { localStorage.setItem(KEY, locked ? 'off' : 'auto'); } catch (e) {}
        label(); tick();
      });
      footer.appendChild(b);
    }

    tick();
    setInterval(tick, 120000);
    /* Enable color easing only AFTER the first paint — pages load
       already-lit instead of flashing day colors while easing. */
    requestAnimationFrame(function () {
      setTimeout(function () { root.classList.add('tgo-anim'); }, 80);
    });
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addToggle);
    else addToggle();
  } catch (err) {}
})();
</script>
