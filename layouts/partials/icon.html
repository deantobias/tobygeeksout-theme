{{/*

  Usage: {{ partial "icon.html" (dict "name" "home") }}

*/}}

>{{ else if eq $name "mail" }}<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 7.5 12 13l8.5-5.5"/
